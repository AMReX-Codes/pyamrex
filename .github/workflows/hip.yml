name: 🐧 HIP

on: [workflow_call]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-hip
  cancel-in-progress: true

env:
  # submit build results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'AMReX-Codes/pyamrex' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  build_hip:
    name: ROCm HIP 6.3.2
    runs-on: ubuntu-24.04
    env:
      CXXFLAGS: "-Werror -Wno-deprecated-declarations -Wno-error=pass-failed"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: install dependencies
      shell: bash
      run: |
        .github/workflows/dependencies/hip.sh 6.3.2
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build pyAMReX
      shell: bash
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=300M
        ccache -z

        source /etc/profile.d/rocm.sh
        hipcc --version
        which clang
        which clang++
        export CXX=$(which clang++)
        export CC=$(which clang)

        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake

        cmake -S . -B build              \
            -DBUILDNAME=Linux-ROCm-HIP-DP \
            -DSITE=GitHub                \
            -DCMAKE_VERBOSE_MAKEFILE=ON  \
            -DpyAMReX_IPO=OFF            \
            -DAMReX_GPU_BACKEND=HIP      \
            -DAMReX_AMD_ARCH=gfx90a      \
            -DAMReX_SPACEDIM="1;2;3"
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        # authoritative pass/fail; compiles nothing new if the build above succeeded
        cmake --build build --target pip_install

        ccache -s
        du -hs ~/.cache/ccache

    - name: Submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit
