name: 🐧 Ubuntu

on: [workflow_call]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-linux
  cancel-in-progress: true

jobs:
  # Build and install libamrex as AMReX CMake project
  gcc10:
    name: GNU@11 Release
    runs-on: ubuntu-24.04
    env:
      CC: gcc-11
      CXX: g++-11
      CXXFLAGS: "-Werror -Wshadow -Woverloaded-virtual -Wunreachable-code -fno-operator-names -Wno-array-bounds"
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: '3.11'
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies_gcc.sh 11
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=800M
        ccache -z

        export CMAKE_BUILD_PARALLEL_LEVEL=4

        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake pytest
        AMREX_MPI=ON python3 -m pip install -v .
        python3 -c "import amrex.space1d as amr; print(amr.__version__)"
        python3 -c "import amrex.space2d as amr; print(amr.__version__)"
        python3 -c "import amrex.space3d as amr; print(amr.__version__)"

        ccache -s
        du -hs ~/.cache/ccache

    - name: Unit tests
      run: |
        mpiexec -np 1 python3 -m pytest tests/

  gcc14:
    name: GNU@14 Debug
    runs-on: ubuntu-24.04
    env: {CXXFLAGS: "-Werror -Wno-error=deprecated-declarations -Wshadow -Woverloaded-virtual -Wunreachable-code -fno-operator-names"}
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies_gcc.sh 14
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        export CC=$(which gcc-14)
        export CXX=$(which g++-14)
        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake
        python3 -m pip install -U pandas pytest mpi4py

        cmake -S . -B build               \
              -DCMAKE_BUILD_TYPE=Debug    \
              -DCMAKE_VERBOSE_MAKEFILE=ON \
              -DBUILD_SHARED_LIBS=ON      \
              -DAMReX_MPI=ON              \
              -DAMReX_SPACEDIM="1;2;3"
        cmake --build build --target pip_install -j 4

        ccache -s
        du -hs ~/.cache/ccache

    - name: Unit tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Unit tests as installed
      run: |
        sudo cp build/lib/libamrex_*.so /usr/lib/
        rm -rf build
        python3 -m pytest tests

  clang14:
    name: Clang@14.0 w/o MPI
    runs-on: ubuntu-24.04
    env: {CXXFLAGS: "-Werror -Wshadow -Woverloaded-virtual -Wextra-semi -Wunreachable-code -fno-operator-names -Wno-pass-failed"}
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies_clang14_libcpp.sh
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=500M
        ccache -z

        export CMAKE_BUILD_PARALLEL_LEVEL=4

        export CC=$(which clang-14)
        export CXX=$(which clang++-14)
        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake pytest
        python3 -m pip install -v .
        python3 -c "import amrex.space1d as amr; print(amr.__version__)"
        python3 -c "import amrex.space2d as amr; print(amr.__version__)"
        python3 -c "import amrex.space3d as amr; print(amr.__version__)"

        ccache -s
        du -hs ~/.cache/ccache

    - name: Unit tests
      run: |
        python3 -m pytest tests/

  clang18:
    name: Clang@18.0 w/ libc++ w/ MPI
    runs-on: ubuntu-24.04
    env:
      CXXFLAGS: "-Werror -Wshadow -Woverloaded-virtual -Wextra-semi -Wunreachable-code -fno-operator-names -Wno-pass-failed -stdlib=libc++"
      LDFLAGS: "-fuse-ld=lld"
      CXX: "clang++"
      CC: "clang"
    steps:
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies_clang18.sh
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=300M
        ccache -z

        export CMAKE_BUILD_PARALLEL_LEVEL=4

        export CC=$(which clang-18)
        export CXX=$(which clang++-18)
        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake
        python3 -m pip install -U pandas pytest
        python3 -m pip install -v .
        python3 -c "import amrex.space1d as amr; print(amr.__version__)"
        python3 -c "import amrex.space2d as amr; print(amr.__version__)"
        python3 -c "import amrex.space3d as amr; print(amr.__version__)"

        ccache -s
        du -hs ~/.cache/ccache

    - name: Unit tests
      run: |
        python3 -m pytest tests/

  clang_sp:
    name: Clang@18.0 w/ SP
    runs-on: ubuntu-24.04
    env:
      CXXFLAGS: "-Werror -Wshadow -Woverloaded-virtual -Wextra-semi -Wunreachable-code -fno-operator-names -Wno-pass-failed"
      LDFLAGS: "-fuse-ld=lld"
      CXX: "clang++"
      CC: "clang"
      AMREX_PRECISION: "SINGLE"
      AMREX_PARTICLES_PRECISION: "SINGLE"
    steps:
      - uses: actions/checkout@v6
      - name: Dependencies
        run: |
          .github/workflows/dependencies/dependencies_clang18.sh
          .github/workflows/dependencies/dependencies_ccache.sh
      - name: Set Up Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-git-
      - name: Build & Install
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=10
          export CCACHE_MAXSIZE=300M
          ccache -z

          export CMAKE_BUILD_PARALLEL_LEVEL=4

          export CC=$(which clang-18)
          export CXX=$(which clang++-18)
          python3 -m pip install -U pip
          python3 -m pip install -U build packaging setuptools[core] wheel
          python3 -m pip install -U cmake
          python3 -m pip install -U pandas pytest
          python3 -m pip install -v .
          python3 -c "import amrex.space1d as amr; print(amr.__version__)"
          python3 -c "import amrex.space2d as amr; print(amr.__version__)"
          python3 -c "import amrex.space3d as amr; print(amr.__version__)"

          ccache -s
          du -hs ~/.cache/ccache

      - name: Unit tests
        run: |
          python3 -m pytest tests/

  nvcc:
    name: CUDA@12.2 GNU@11
    runs-on: ubuntu-24.04
    env: {CXXFLAGS: "-fno-operator-names"}
    steps:
    - name: Free More Disk Space
      uses: ax3l/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false  # apt takes ~1:30min
        docker-images: true
        swap-storage: false
    - uses: actions/checkout@v6
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies_nvcc.sh 12.2
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=800M
        ccache -z

        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        which nvcc || echo "nvcc not in PATH!"

        export CC=$(which gcc-11)
        export CXX=$(which g++-11)
        export CUDAHOSTCXX=$(which g++-11)

        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U cmake

        cmake -S . -B build             \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DAMReX_GPU_BACKEND=CUDA    \
            -DAMReX_SPACEDIM="1;2;3"    \
            -DCMAKE_CUDA_STANDARD=17    \
            -DCMAKE_CXX_STANDARD=17     \
            -DAMReX_CUDA_ARCH=8.0       \
            -DAMReX_CUDA_ERROR_CROSS_EXECUTION_SPACE_CALL=ON \
            -DAMReX_CUDA_ERROR_CAPTURE_THIS=ON
        cmake --build build --target pip_install -j 2

        ccache -s
        du -hs ~/.cache/ccache
